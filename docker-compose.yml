services:
  mail-preview:
    build: .
    image: mail-preview:latest
    container_name: mail-preview
    ports:
      - "8000:8000"
    restart: unless-stopped
    # 不挂载任何宿主卷：上传内容与重编码图片只存在进程内存
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
